<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artist Platform — O sistema operacional da carreira do artista</title>
    <script>
      // Aplica o tema salvo antes do CSS para evitar flash branco no modo escuro
      try {
        var theme = localStorage.getItem('artistPlatform.theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.background = '#07070a';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
